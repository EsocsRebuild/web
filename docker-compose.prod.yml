# ESOCS Web: Production Container Stack.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up --build -d                  # standalone app on http://localhost:3020
#   docker compose -f docker-compose.prod.yml --profile proxy up --build -d  # with Caddy HTTPS proxy on :80/:443
#   docker compose -f docker-compose.prod.yml down                           # stop production stack

name: esocs-prod

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  web-prod:
    <<: *hardening
    container_name: esocs-web-prod
    image: ${IMAGE:-esocs-web}:${TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3020}
        DEPLOYMENT_ID: ${DEPLOYMENT_ID:-local}
        APP_VERSION: ${APP_VERSION:-local}
      secrets:
        - server_actions_key
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3020}
    ports:
      - "${WEB_PORT:-3020}:3000"
    volumes:
      # Persistent cache for regenerated pages and optimized images across restarts
      - esocs-next-cache:/app/.next/cache
    tmpfs:
      - /tmp:size=64m
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
        reservations:
          memory: 256m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  proxy:
    <<: *hardening
    container_name: esocs-proxy
    profiles: [proxy]
    image: caddy:2-alpine
    depends_on:
      web-prod:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:size=16m

volumes:
  esocs-next-cache:
    name: esocs-next-cache
  caddy-data:
  caddy-config:

secrets:
  server_actions_key:
    file: ${SERVER_ACTIONS_KEY_FILE:-./deploy/secrets/server_actions_key}
