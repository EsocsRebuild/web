name: esocs-platform

services:
  # ---------------------------------------------------------------------------
  # Development Environment (with hot-reloading)
  # Run: docker compose up web-dev
  # Access: http://localhost:3000
  # ---------------------------------------------------------------------------
  web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: esocs-web-dev
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      - NEXT_PUBLIC_USE_HTTP_SOCIAL=${NEXT_PUBLIC_USE_HTTP_SOCIAL:-false}
      - ENABLE_DESIGN_SYSTEM=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Production Environment (standalone optimized container)
  # Run: docker compose up web-prod
  # Access: http://localhost:3001 (or mapped WEB_PROD_PORT)
  # ---------------------------------------------------------------------------
  web-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NODE_VERSION: "24"
        DEBIAN_RELEASE: "bookworm"
        NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}"
        DEPLOYMENT_ID: "${DEPLOYMENT_ID:-local}"
    container_name: esocs-web-prod
    restart: always
    ports:
      - "${WEB_PROD_PORT:-3001}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    volumes:
      - esocs-next-cache:/app/.next/cache
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  esocs-next-cache:
    name: esocs-next-cache
