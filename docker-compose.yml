# ESOCS Web: Development Stack with Live Hot-Reloading (Fast Refresh).
#
# Usage:
#   docker compose up --build        # Start dev container in foreground with live logs
#   docker compose up -d             # Start dev container in background
#   docker compose down              # Stop dev container
#
# File changes on your computer are reflected INSTANTLY in your browser without rebuilding.

name: esocs-dev

services:
  web:
    container_name: esocs-web-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3020}:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3020}
      - NEXT_PUBLIC_USE_HTTP_SOCIAL=${NEXT_PUBLIC_USE_HTTP_SOCIAL:-false}
      - ENABLE_DESIGN_SYSTEM=true
    volumes:
      # Mount current repository for live hot-reloading
      - .:/app
      # Keep container node_modules isolated from host OS
      - /app/node_modules
      # Keep container .next build cache isolated
      - /app/.next
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
