name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:hooks
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    name: Build and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          ENABLE_DESIGN_SYSTEM: "true"
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile
        run: docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" hadolint/hadolint < Dockerfile

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          load: true
          tags: esocs-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=http://localhost:3000
            DEPLOYMENT_ID=${{ github.sha }}
            APP_VERSION=ci-${{ github.run_number }}
            VCS_REF=${{ github.sha }}

      - name: Start container (hardened, as in production)
        run: |
          docker run -d --name web -p 3000:3000 \
            --read-only --tmpfs /tmp --tmpfs /app/.next/cache \
            --cap-drop ALL --security-opt no-new-privileges:true \
            esocs-web:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' web)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' web | grep -qx healthy || { docker logs web; exit 1; }

      - name: Smoke test
        run: |
          set -euo pipefail
          check() { code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$1"); echo "$1 → $code"; [ "$code" = "$2" ]; }
          check /api/health 200
          check / 200
          check /church/esocs 200
          check /church/oroigwe-pro-cathedral 200
          check /find 200
          check /events 200
          check /media/legacy/2025/02/Baba-Orimolade.png.webp 200
          check /pastors/419 308
          check /this-page-does-not-exist 404
          curl -s http://localhost:3000/api/health | grep -q "\"deploymentId\":\"${{ github.sha }}\""
          [ "$(docker exec web id -u)" = "1001" ] || { echo "Container must not run as root"; exit 1; }

      - name: Scan for vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress esocs-web:ci

      - name: Container logs
        if: failure()
        run: docker logs web || true
