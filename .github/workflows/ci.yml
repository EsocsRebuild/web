name: High-Speed Continuous Integration (CI)

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Tier 1: Fast Code Quality & Type Check Gate (< 45 seconds)
  quality-gate:
    name: Tier 1 - Code Quality & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:hooks
      - run: npm run format:check

  # Tier 1: High-Speed Vitest Unit & Integration Suite (< 30 seconds)
  unit-and-integration-tests:
    name: Tier 1 - Unit & Integration Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run test:githooks

  # Tier 2: Production Build & Containerization Gate (< 60 seconds)
  production-build-gate:
    name: Tier 2 - Production Build & Container Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality-gate, unit-and-integration-tests]
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Cache Next.js Build Output
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Execute Next.js Production Build
        run: npm run build
        env:
          ENABLE_DESIGN_SYSTEM: "true"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Verify Docker Production Build
        run: docker build -t esocs-web:local .
