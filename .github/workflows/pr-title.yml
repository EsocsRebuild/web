name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  statuses: write

jobs:
  conventional:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Allow "[WIP] feat: ..." without failing
          wip: true

          # Validate that the PR has a single, well-formed commit (squash-friendly)
          validateSingleCommit: true

          # Skip validation entirely for bot PRs and explicitly ignored PRs
          ignoreLabels: |
            bot
            ignore-semantic-pull-request
            dependencies
            autorelease: pending

          # Enforce lowercase types, require a subject, forbid empty scope
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.

          # Explicit allow-list (documented, version-controlled, reviewable)
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

          # Restrict scopes to known areas of your codebase (edit as needed)
          scopes: |
            api
            ui
            cli
            deps
            config
            release
          requireScope: false
