version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      react-next:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
      radix:
        patterns: ["@radix-ui/*"]
      testing:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "@playwright/test", "@axe-core/*", "jsdom"]
      tooling:
        patterns:
          [
            "eslint",
            "prettier*",
            "typescript",
            "tailwindcss",
            "@tailwindcss/*",
            "lint-staged",
            "@commitlint/*",
          ]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
